<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}orbita — AI-агент для подбора и бронирования отелей{% endblock %}</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<link href="/static/css/base.css" rel="stylesheet">
{% block styles %}{% endblock %}
</head>

<body>
<div class="bloom" aria-hidden="true"></div>

<header class="site-header">
  <a class="brand" href="/">
    <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
      <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="12" y1="3.5" x2="12" y2="20.5"/>
        <line x1="4.6" y1="7.8" x2="19.4" y2="16.2"/>
        <line x1="19.4" y1="7.8" x2="4.6" y2="16.2"/>
      </g>
    </svg>
    orbita
  </a>

  <nav class="nav">
    <a href="#how">Как это работает</a>
    <a href="#results">Подборки</a>
    <a href="/chat">Начать</a>
  </nav>

    <div class="header-right">
    <!-- <span class="status"><i></i>агент онлайн</span> -->
    {% if user %}
        <a class="btn-user" href="/dashboard" title="Личный кабинет">
        <span class="avatar" aria-hidden="true">
            <svg viewBox="0 0 16 16" fill="currentColor">
            <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z"/>
            </svg>
        </span>
        <span class="user-name">{{ user.username }}</span>
        </a>
    {% else %}
        <a href="/login" class="btn-ghost" type="button">Войти</a>
    {% endif %}
    </div>
</header>

<main>
  {% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <div class="foot-inner">
    <span class="brand">
      <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
        <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="12" y1="3.5" x2="12" y2="20.5"/>
          <line x1="4.6" y1="7.8" x2="19.4" y2="16.2"/>
          <line x1="19.4" y1="7.8" x2="4.6" y2="16.2"/>
        </g>
      </svg>
      orbita
    </span>
    <span>Опишите вечер — мы найдём место.</span>
    <span class="copy">© 2026 Millsyara</span>
  </div>
</footer>

<script src="/static/js/base.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
