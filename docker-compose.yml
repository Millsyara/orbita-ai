services:
  app:
    build: .
    container_name: orbita_ai_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SQLALCHEMY_DATABASE_URL: sqlite+aiosqlite:////data/database.db
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 5s
      retries: 3